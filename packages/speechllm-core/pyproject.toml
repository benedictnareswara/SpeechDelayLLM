[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speechllm-core"
version = "0.2.0"
description = "Pure routing/detection logic for SpeechLLM — no hardware, no I/O"
requires-python = ">=3.10"
dependencies = [
    "python-Levenshtein>=0.25.1",
]

[project.optional-dependencies]
# Gemini generation is NOT installed on the device. It is used by build-time
# tooling (tools/expand_bank.py) and the dev server.
generation = [
    "google-generativeai>=0.8.0",
    "python-dotenv>=1.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
