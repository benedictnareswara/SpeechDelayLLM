[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speechllm-device"
version = "0.2.0"
description = "SpeechLLM device application for the Orange Pi Zero 3"
requires-python = ">=3.10"

# Deliberately minimal and fully offline. No google-generativeai, no gTTS,
# no fastapi. Versions are intentionally loose here; the tested aarch64 pins
# live in deploy/orangepi/requirements-device.txt (see Milestone 0).
dependencies = [
    "speechllm-core",
    "numpy>=1.24",
    "onnxruntime>=1.16",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.7",
    "soxr>=0.3.7",
    "pyserial>=3.5",
]

[project.scripts]
speechllm-device = "speechllm_device.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
