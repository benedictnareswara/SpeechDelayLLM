# ALSA configuration — Orange Pi Zero 3
#
# Install to /etc/asound.conf.
#
# The USB microphone is the only capture device this system uses. Card indexes
# are not stable across boots, so the card is selected by name. Confirm yours:
#
#     arecord -l
#     cat /proc/asound/cards
#
# ⚠️ Set this to YOUR capsule's name. It is not always "USB" — the unit this
# was developed against reports `GVAUDIO`. If the name here does not match a
# real card, ALSA falls through to the system default, which on the Zero 3 is
# HDMI. HDMI has no capture channel, so the failure looks like a broken audio
# stream rather than a misconfigured device name.
#
# Alternatively set AUDIO_INPUT_DEVICE in device.env and delete this file
# entirely — sounddevice selects by name itself and does not need the ALSA
# default to be correct.

pcm.!default {
    type asym
    capture.pcm "mic"
}

pcm.mic {
    type plug          # plug handles rate/format conversion if the app asks for
    slave.pcm "hw_mic" # something the hardware cannot do natively
}

pcm.hw_mic {
    type hw
    card "GVAUDIO"
}

ctl.!default {
    type hw
    card "GVAUDIO"
}

# Note: no playback device is configured. Audio output goes through the
# DFPlayer Mini over UART, which is not an ALSA device at all — the Pi never
# renders audio itself.
