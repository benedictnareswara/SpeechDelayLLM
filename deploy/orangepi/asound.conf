# ALSA configuration — Orange Pi Zero 3
#
# Install to /etc/asound.conf.
#
# The USB microphone is the only capture device this system uses. Card indexes
# are not stable across boots, so the card is selected by name: `USB` matches
# the generic descriptor most cheap capsules report. Confirm yours with:
#
#     arecord -l
#     cat /proc/asound/cards
#
# If your mic reports a different name, change `card "USB"` below to match, or
# just set AUDIO_INPUT_DEVICE in device.env and delete this file — sounddevice
# selects by name itself and does not require ALSA defaults to be correct.

pcm.!default {
    type asym
    capture.pcm "mic"
}

pcm.mic {
    type plug          # plug handles rate/format conversion if the app asks for
    slave.pcm "hw_mic" # something the hardware cannot do natively
}

pcm.hw_mic {
    type hw
    card "USB"
}

ctl.!default {
    type hw
    card "USB"
}

# Note: no playback device is configured. Audio output goes through the
# DFPlayer Mini over UART, which is not an ALSA device at all — the Pi never
# renders audio itself.
